initial_conditions:
  - pressure: 1.1e+05
    temperature: Null
    fill: 0.95

  - pressure: 1.5e+05
    temperature: Null
    fill: 0.95

  - pressure: 2.0e+05
    temperature: Null
    fill: 0.95
  
  - pressure: 2.5e+05
    temperature: Null
    fill: 0.95

  - pressure: 3.0e+05
    temperature: Null
    fill: 0.95

  - pressure: 3.5e+05
    temperature: Null
    fill: 0.95

  - pressure: 4.0e+05
    temperature: Null
    fill: 0.95

operational_envelope:
  max_pressure: Null
  min_pressure: 1.2e+05
  min_temperature: Null
  min_fill: Null
  min_mass: 50

tank:
  type: cylindrical_spherical_end_caps

fuel_volume_margin: 1.0

mission:
  file_name: small_medium_range
  fuel_flow_phase: liquid
  fuselage_radius: 2.05

material:
  type: composite
  name: IM7/8552
  args:
    failure_stress: 1260.0e+06        # 4K failure stress taken from Hohe et al.
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55
    degrees: True

insulation:
  type: foam_variable_linearised
  args:
    name: rohacell
    thickness: 0.08

multistep_method:
  type: euler
  timestep: 60

efficiency_computers:
  gravimetric: basic
  volumetric: basic

stopping_criteria: []

heat_flux_factor: 1.0

dynamic_model_formulation: "ahluwalia"

thermal_model_formulation:
  internal: "single_zone_model"
  external: "forced_convection_model"

thermal_capacity_convergence: False

plotting:
  time_label: "Time [hour]"
  pressure_label: "Pressure [bar]"
  temperature_label: "Temperature [K]"
  flux_label: "Required Heat Flux [MW]"
  x:
    label: Pressure [bar]
    ticks:
      min: 0.5
      max: 4.5
      step: 0.5
  y:
    label: Efficiency [-]
    ticks:
      min: 0.9
      max: 0.93
      step: 0.005

