initial_conditions:
  pressure: 1.4e+05
  temperature: Null
  fill: 0.95

operational_envelope:
  max_pressure: Null
  min_pressure: 1.2e+05
  min_temperature: Null
  min_fill: Null
  min_mass: 50

tank:
  type: cylindrical_spherical_end_caps

fuel_volume_margin: 1.0

missions:
    - file_name: regional
      fuel_flow_phase: liquid
      fuselage_radius: 1.4
      label: REG
      
    - file_name: small_medium_range
      fuel_flow_phase: liquid
      fuselage_radius: 2.05
      label: SMR

    - file_name: large_passenger_aircraft
      fuel_flow_phase: liquid
      fuselage_radius: 2.8
      label: LPA

material:
  type: composite
  name: IM7/8552
  args:
    failure_stress: 1260.0e+06        # 4K failure stress taken from Hohe et al.
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55
    degrees: True

insulation:
  type: foam_variable_linearised
  args:
    name: rohacell
    thickness: 0.08

multistep_method:
  type: euler
  timestep: 60

stopping_criteria: []

heat_flux_factor: 1.0

dynamic_model_formulation: "ahluwalia"

thermal_model_formulation:
  internal: "single_zone_model"
  external: "forced_convection_model"

thermal_capacity_convergence: False

plotting:
  time_label: "Time [hour]"
  pressure_label: "Pressure [bar]"
  temperature_label: "Temperature [K]"
  flux_label: "Required Heat Flux [MW]"
  time_ticks:
    min: 0.0
    max: 12.0
    step: 2
  pressure_ticks:
    min: 1
    max: 4.0
    step: 0.5
  temperature_ticks:
    min: 18
    max: 30.0
    step: 2
  flux_ticks:
    min: 0.0
    max: 7.0
    step: 1.0

