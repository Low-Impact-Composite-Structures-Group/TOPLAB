initial_conditions:
  pressure: 1.2e+05
  temperature: Null
  fill: 0.95

operational_envelope:
  max_pressure: Null
  min_pressure: 1.1e+05
  min_temperature: Null
  min_fill: Null
  min_mass: 500

# tank:
#   type: cylindrical_spherical_end_caps
#   dimensions:
#     radius: 1.17
#     body_length: 16.6

# fuel_volume_margin: 1.15

mission:
  file_name: large_passenger_aircraft
  fuel_flow_phase: liquid
  fuselage_radius: 2.05

material:
  type: composite
  args:
    failure_stress: 2560.0e+06
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55
    degrees: True

insulation:
  type: "foam_constant"
  args:
    thickness:
      min: 0.1e-12
      max: 0.2
      step: 0.025
    # density: 51.1
    density: 10.0
    thermal_conductivity: 0.015

multistep_method:
  type: euler
  timestep: 60

stopping_criteria: []

heat_flux_factor: 1.3

dynamic_model_formulation: "ahluwalia"

thermal_model_formulation:
  internal: single_zone_model
  external: forced_convection_model

thermal_capacity_convergence: True

plotting:
  time_ticks:
    min: 0.0
    max: 12.0
    step: 2
  pressure_ticks:
    min: 1
    max: 4.0
    step: 0.5
  temp_ticks:
    min: 18
    max: 30.0
    step: 2
  flux_ticks:
    min: 0.0
    max: 2.0
    step: 0.25