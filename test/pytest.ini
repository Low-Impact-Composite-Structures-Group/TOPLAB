# Multi-Tank Framework Test Configuration
# pytest configuration file

[pytest]
# Test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Tests that take a long time to run
    nist: Tests related to NIST materials framework
    config: Tests related to configuration parsing
    orchestrator: Tests related to system orchestrator
    plotting: Tests for DelftColourPlotter framework
    coupling: Tests for multi-tank coupling functionality
    validation: Analysis validation tests
    physics: Physics consistency tests
    fallback: Tests for fallback value logging system
    regression: Full analysis regression tests
    performance: Performance and timing tests

# Coverage settings
[coverage:run]
source = src/
omit =
    */test*
    */conftest.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

# Minimum coverage percentage
fail_under = 80