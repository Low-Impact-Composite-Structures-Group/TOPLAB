[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "toplab"
version = "0.1.0"
description = "Thermomechanical OPtimization LAB – hydrogen fuel system modelling library"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "coolprop",
    "optuna",
    "networkx",
    "pandas",
    "rich",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toplab", "toplab.*"]
