analysis:
  name: Pressure-Fed LH2-GH2 System
  description: >-
    LH2 tank (Tank 1) discharges through an explicit split junction. 5% is
    diverted through HEX + compressor into a GH2 buffer (Tank 2), then a
    second junction mixes the buffer stream before the fuel cell.
  version: '1.0'

network:
  nodes:
  - node_id: 1
    type: tank
    description: LH2 main tank
    fluid: SLH2
    geometry:
      phi: 3.0
      mission_based_sizing: true
    initial_conditions:
      pressure: 800000.0        # 8 bar (two-phase / near-saturation)
      temperature: 22.0         # K  (T_sat at ~7.5 bar; slightly compressed at 8 bar)
      density: 70.0             # kg/m³ (liquid-dominated)
    operating_limits:
      minimum_pressure: 500000.0    # 5 bar – Config B floor
      venting_pressure: 1200000.0   # 12 bar
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
      insulation:
        thickness: 0.10
        heat_transfer_coefficient: 0.005   # vacuum-insulated
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.0
      use_density_stopping_events: true
      use_duration_stopping: true
    plotting: {}

  - node_id: 2
    type: tank
    description: GH2 buffer tank
    fluid: CH2
    geometry:
      phi: 1.0
      radius: 0.4            # V ≈ 0.268 m³ spherical; adequate for ~11 kg GH2 buffer
    initial_conditions:
      pressure: 1000000.0    # 10 bar (just below pressure_close_bar)
      temperature: 293.15    # K ambient
      density: 0.83          # kg/m³ ≈ ideal-gas GH2 at 10 bar, 293 K
    operating_limits:
      minimum_pressure: 100000.0    # 1 bar
      venting_pressure: 2500000.0   # 25 bar
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
      insulation:
        thickness: 0.02
        heat_transfer_coefficient: 50.0   # ambient (no insulation)
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 0.05
      use_density_stopping_events: false
      use_duration_stopping: true
    plotting: {}

  - node_id: split_junction
    type: junction
    junction_role: splitter
    description: LH2 discharge split point

  - node_id: mixer_junction
    type: junction
    junction_role: mixer
    description: GH2 mix point before fuel cell

  - node_id: fuel_cell
    type: sink
    description: Fuel cell demand endpoint

  edges:
  - edge_id: lh2_to_split_junction
    connection_type: discharge
    description: Tank 1 mission outflow reaches the split junction.
    participants:
      source: 1
      target: split_junction

  - edge_id: split_junction_to_fuel_cell
    connection_type: discharge
    description: >-
      95% bypasses compressor and continues to the fuel cell through the
      main conditioning chain.
    participants:
      source: split_junction
      target: fuel_cell
    split_fraction: 0.95
    main_conditioning_components:
    - type: ideal_heat_exchanger
      target_temperature: 330.0
      pressure_drop: 0.0
    - type: pressure_regulator
      outlet_pressure: 300000.0   # 3 bar

  - edge_id: split_junction_to_gh2_buffer
    connection_type: coupling
    description: >-
      5% continues to compressor (15 bar) and enters the GH2 buffer tank.
    participants:
      source: split_junction
      target: 2
    split_fraction: 0.05
    peripheral_components:
    - type: ideal_heat_exchanger
      target_temperature: 330.0
      pressure_drop: 0.0
    - type: compressor
      outlet_pressure: 1500000.0   # 15 bar (mid-band target)
      efficiency: 0.85

  - edge_id: gh2_buffer_to_mixer
    connection_type: pressure_triggered_discharge
    description: >-
      GH2 buffer discharges to the mixer junction.
      Valve opens at 15 bar, closes at 11 bar.
    participants:
      source: 2
      target: mixer_junction
    activation_conditions:
      pressure_open_bar: 15.0
      pressure_close_bar: 11.0
    flow_parameters:
      max_flow_rate_kg_s: 0.01   # generous ceiling; actual flow governed by hysteresis band

  - edge_id: mixer_junction_to_fuel_cell
    connection_type: discharge
    description: GH2 mixes with the main stream before the fuel cell.
    participants:
      source: mixer_junction
      target: fuel_cell
    discharge_conditioning:
    - type: pressure_regulator
      outlet_pressure: 300000.0   # 3 bar – reduce to match main conditioned stream

mission:
  type: discharge
  profile: csv
  parameters:
    csv_file: mission.csv
    cruise_altitude: 0.0
    standard_temperature: 293.15
    mach_number: 0.0
    phase: gas
  ambient_temperature: 293.15
  assigned_to_node: 1

physics:
  fluid_properties:
    use_coolprop: true
    coolprop_fluid: H2
    backup_properties:
      specific_gas_constant: 4124.0
      heat_capacity_ratio: 1.4
      kinematic_viscosity: 1.0e-7
      speed_of_sound: 1000.0
  orifice_flow:
    discharge_coefficient: 0.6
    flow_coefficient_units: dimensionless
  choked_flow:
    enable_choked_flow: false
  safety_limits:
    minimum_pressure_pa: 1000.0
    maximum_velocity_ms: 2000.0
  numerical:
    pressure_tolerance_pa: 1000.0
    flow_rate_tolerance_kg_s: 1.0e-5
    property_update_frequency: 1

solver:
  method: LSODA
  rtol: 1.0e-6
  atol: 1.0e-9
  time_step: 1.0
  max_step: 10.0

output:
  identifier: pressure_fed
  save_plots: true
  plot_formats:
  - png
  save_data: true
  data_format: csv
  results_directory: output/results
  plots_directory: output/plots
  plots:
    figure_prefix: Pressure-Fed_LH2-GH2_System
    reference_lines:
      pressure:
        show_p_min: true
        show_p_vent: true
      temperature:
        show_t_ambient: false
      density:
        show_stopping_density: true
    tank_states:
      filename: evolution
      separate_figures: false
      dpi: 900
      event_lines: []
      xlim: null               # e.g. [0.0, 1.4] or null for autofit
      ylim_pressure: null      # e.g. [0, 12]    or null for autofit  [bar]
      ylim_temperature: null   # e.g. [15, 350]  or null for autofit  [K]
      ylim_density: null       # e.g. [0, 75]    or null for autofit  [kg/m³]
      legend_locations:
        pressure: best
        temperature: best
        density: best
    density_temperature:
      isobar_pressures:
      - 5
      - 10
      show_reference_pressures: false
      include_saturation_line: true  # relevant for Tank 1 (LH2)
      include_isobars: true
      arrow_position: 0.25
      arrow_size: 1.0
      valve_marker_size: 8.0
      legend_location: upper right
      xlim: null               # e.g. [15, 340]  or null for autofit  [K]
      ylim: null      # e.g. [0, 75]    or null for autofit  [kg/m³]
    mass_flows:
      enabled: true
      filename: mass_flows
      include_venting_flow: true
      include_coupling_flows: true
      xlim: null               # e.g. [0.0, 1.4] or null for autofit
      ylim: null               # e.g. [0, 0.02]  or null for autofit  [kg/s]
      legend_location: best
    fuel_cell_inlet:
      enabled: true
      filename: fuel_cell_inlet
      xlim: null               # e.g. [0.0, 1.4] or null for autofit
      ylim_mdot: null          # e.g. [0, 5]     or null for autofit  [g/s]
      ylim_temp: null          # e.g. [280, 340] or null for autofit  [K]
      ylim_pres: null          # e.g. [2.5, 3.5] or null for autofit  [bar]
      legend_location: center
    hex_compressor_power:
      enabled: true
      filename: power
      xlim: null               # e.g. [0.0, 1.4] or null for autofit
      ylim_power: null         # e.g. [0, 70]   or null for autofit  [kW]
      ylim_energy: null        # e.g. [0, 120]  or null for autofit  [MJ]
      legend_location_power: best
      legend_location_energy: best
