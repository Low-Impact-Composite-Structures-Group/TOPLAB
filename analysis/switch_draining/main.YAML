initial_conditions:
  pressure: 1.4e+05
  temperature: Null
  fill: 0.95

operational_envelope:
  max_pressure: 2.0e+05
  min_pressure: 1.1e+05
  min_temperature: Null
  min_fill: 0.05
  min_mass: 500

efficiency_computers:
  gravimetric: basic

tank:
  type: cylindrical_spherical_end_caps
  dimensions:
    radius: 2.05
    body_lengths: [0, 2]

fuel_volume_margin: 1.15

missions:
  - name: Cruise-Drain
    duration: 60.0e+10
    fuel_flows:
    - mass_flow: -0.2082
      phase: "liquid"
    altitude: 11.0e+03
    mach_number: 0.78
    ground_temperature: 288.15


material:
  type: composite
  name: IM7/8552
  args:
    failure_stress: 1260.0e+06        # 4K failure stress taken from Hohe et al.
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55
    degrees: True


insulation:
  type: foam_variable_linearised
  args:
    name: rohacell
    thickness: 0.08


multistep_method:
  type: euler
  timestep: 60


stopping_criteria:
  - tank_is_empty
  - no_fuel_mass


heat_flux_factor: 1.3


dynamic_model_formulation: "always_two_phase"


thermal_model_formulation:
  internal: single_zone_model
  external: forced_convection_model

thermal_capacity_convergence: False

plotting:
  x_label: "Tank Length [m]"
  y_label: "Gravimetric Efficiency [-]"
  length_ticks:
    min: 0.0
    max: 3.0
    step: 0.5
  efficiency_ticks:
    min: 0.9
    max: 1.0
    step: 0.025