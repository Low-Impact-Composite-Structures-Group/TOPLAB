initial_conditions:
  pressure: 1.4e+05
  temperature: Null
  fill: 0.95

operational_envelope:
  min_pressure: 1.1e+05
  min_mass: 50

tank:
  type: cylindrical_spherical_end_caps
  dimensions:
    radii:
      min: 0.25
      max: 2.75
      step: 0.05
    body_length:
      min: 0.0
      max: 6.0
      step: 0.05

mission:
  - name: Cruise-Drain
    duration: 60.0e+12
    fuel_flows:
    - mass_flow: -0.2082
      phase: liquid
    altitude: 11.0e+03
    mach_number: 0.78
    ground_temperature: 288.15

reference_missions:
  - file: regional
    label: REG
  
  - file: small_medium_range
    label: SMR

  - file: large_passenger_aircraft
    label: LPA

material:
  type: composite
  name: IM7/8552
  args:
    failure_stress: 1260.0e+06        # 4K failure stress taken from Hohe et al.
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55
    degrees: True

insulation:
  type: foam_variable_linearised
  args:
    name: rohacell
    thickness: 0.08

multistep_method:
  type: euler
  timestep: 60

stopping_criteria:
  - no_fuel_mass

heat_flux_factor: 1.0

dynamic_model_formulation: ahluwalia

thermal_model_formulation:
  internal: single_zone_model
  external: natural_convection_model

thermal_capacity_convergence: True

plotting:
  volumetric_efficiency_levels:
    min: 0.55
    max: 0.95
    step: 0.1
  colour_bar_label: "Gravimetric Efficiency [-]"
  x_axis:
    label: "Tank Body Length [m]"
    ticks: 
      min: 0.0
      max: 6.0
      step: 1.0
  y_axis:
    label: "Tank Radius [m]"
    ticks:
      min: 0.25
      max: 2.75
      step: 0.5