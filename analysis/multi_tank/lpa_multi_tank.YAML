initial_conditions:
  pressure: 1.4e+05
  temperature: Null
  fill: 0.95

operational_envelope:
  min_pressure: 1.1e+05
  min_mass: 500

efficiency_computers:
  gravimetric: basic
  volumetric: hexagon

tank:
  type: cylindrical_spherical_end_caps
  number_of_tanks:
    min: 1
    max: 7
    step: 3
  dimensions:
    radii:
      min: 0.25
      max: 2.75
      step: 0.25

mission:
  file_name: large_passenger_aircraft
  fuel_flow_phase: liquid

material:
  type: composite
  name: IM7/8552
  args:
    failure_stress: 1260.0e+06        # 4K failure stress taken from Hohe et al.
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55
    degrees: True

insulation:
  type: foam_constant
  args:
    thickness: 0.08
    density: 51.1
    thermal_conductivity: 0.015

multistep_method:
  type: euler
  timestep: 60

stopping_criteria:
  - no_fuel_mass

heat_flux_factor: 1.0

dynamic_model_formulation: ahluwalia

thermal_model_formulation:
  internal: single_zone_model
  external: natural_convection_model

thermal_capacity_convergence: True

plotting:
  x_label: "Tank Radius [m]"
  x_ticks:
    min: 0.0
    max: 3.0
    step: 0.5
  y_ticks:
    min: 0.0
    max: 1.0
    step: 0.2