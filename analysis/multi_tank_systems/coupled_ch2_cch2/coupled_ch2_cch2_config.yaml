# Coupled CH2-CCH2 Multi-Tank System Configuration
analysis_name: "Coupled CH2-CCH2 Multi-Tank System"
description: "Two-tank coupled system: CH2 (700 bar, 330K) + CCH2 (400 bar, 53K) with pressure compensation coupling and ATR72 mission profile"
version: "1.0"

# Network topology definition
network:
  number_of_tanks: 2
  external_source: false
  external_sink: true
  tanks:
    - tank_id: 1
      tank_type: "CH2"     # Compressed hydrogen tank (high pressure, room temperature)
    - tank_id: 2
      tank_type: "CcH2"    # Cryocompressed hydrogen tank (medium pressure, cryogenic)

# Tank geometry and initial conditions
geometry:
  # Tank 1: CH2 - High pressure compressed hydrogen (user-defined sizing)
  1:
    phi: 3.0                             # Length/radius ratio (L/R)
    radius: 0.7                          # m (user-specified radius for 150kg fuel capacity)
    initial_pressure: 70000000           # Pa (700 bar - high pressure gaseous storage)
    initial_temperature: 330.0           # K (room temperature - ensure proper initialization)
    initial_density: 42.0                # kg/m³ (calculated for 700 bar at 330K)
    venting_pressure: 80000000           # Pa (800 bar - venting pressure)
    minimum_pressure: 1500000            # Pa (15 bar - minimum allowable pressure)

  # Tank 2: CCH2 - Cryocompressed hydrogen (mission-based sizing)
  2:
    phi: 3.0                             # Length/radius ratio (L/R)
    initial_pressure: 40000000           # Pa (400 bar - cryocompressed storage)
    initial_temperature: 53.25           # K (cryogenic temperature)
    initial_density: 80.0                # kg/m³ (cryocompressed density)
    venting_pressure: 45000000           # Pa (450 bar - venting pressure)
    minimum_pressure: 1500000            # Pa (15 bar - minimum allowable pressure)
    mission_based_sizing: true           # Size based on ATR72 mission requirements

# Material specifications with NIST temperature-dependent properties
materials:
  liner:
    nist_path: "aluminum_6061T6_nist"    # Path to NIST materials library
    thickness: 0.005                     # m (5mm aluminum liner)
  composite:
    nist_path: "carbon_epoxy_nist"                # Path to NIST materials library
    winding_angle: 54.7                  # degrees (optimal winding angle)
  insulation:
    thickness: 0.050                     # m (50mm insulation layer)
    heat_transfer_coefficient: 0.025     # W/m²K (vacuum insulation)
  safety_margin: 1.25                    # Structural design safety factor

# Mission profile configuration
mission:
  type: "discharge"                      # Mission type: discharge
  profile: "atr72"                       # Profile: ATR72 turboprop aircraft
  ambient_temperature: 288.15            # K (ambient conditions)
  assigned_to: 2                         # Mission assigned to Tank 2 (CCH2)

# Stopping criteria
stopping_criteria:
  minimum_density: 5.8                  # kg/m³ (CCH2 minimum density requirement)
  use_density_stopping_events: true     # Use density-based stopping events
  use_duration_stopping: true           # Stop when mission duration is reached

# Coupling rules for inter-tank pressure compensation
coupling_rules:
  - coupling_id: "ch2_cch2_pressure_compensation"
    coupling_type: "pressure_compensation"
    participants:
      source: 1                          # CH2 tank (high pressure source)
      target: 2                          # CCH2 tank (receives compensation)
    activation_conditions:
      pressure_differential_bar: 5.0     # Minimum pressure difference for activation
      minimum_source_pressure_bar: 50.0  # Minimum source pressure
      maximum_target_pressure_bar: 450.0 # Maximum target pressure
    flow_parameters:
      flow_resistance: 100.0             # Flow resistance parameter
      bidirectional: false               # Only source → target flow
      max_flow_rate_kg_s: 0.10          # kg/s
    hysteresis:
      activation_threshold_bar: 16.0    # Open valve when Tank 2 pressure ≤ 20 bar (activation condition)
      deactivation_threshold_bar: 20.0  # Close valve when Tank 2 pressure ≥ 23 bar (deactivation condition)

# Solver configuration - optimized for coupling dynamics
solver:
  method: "LSODA"                         # BDF solver better for stiff coupling dynamics
  rtol: 1e-4                            # Relaxed relative tolerance for faster performance
  atol: 1e-7                            # Relaxed absolute tolerance
  time_step: 5.0                        # Smaller time step to capture valve dynamics [s]
  max_step: 10.0                        # Smaller maximum step size [s]
  custom_config: true                   # Use custom solver precision for performance

# Output settings
output:
  identifier: "coupled_ch2_cch2_multi_tank"  # Identifier string appended to file names
  save_plots: true
  plot_formats: ["png", "pdf"]
  save_data: true
  data_format: "csv"
  results_directory: "output/results"
  plots_directory: "output/plots"

  # Plotting handled by DelftColourPlotter in SystemOrchestrator.generate_plots()

  # Plot configurations
  plots:
    # Plotting style options
    style:
      use_greyscale: true              # Set to true for greyscale plots with markers
      enable_multi_tank_overlay: false   # Overlay multiple tanks on same evolution plot

    # Reference lines configuration
    reference_lines:
      pressure:
        show_p_min: true           # Show minimum allowable pressure line
        show_p_vent: true          # Show maximum allowable / venting pressure line
      temperature:
        show_t_ambient: false       # Show ambient temperature line
      density:
        show_stopping_density: false # Show stopping density line

    # Individual plot configurations
    tank_states:
      enabled: true
      figsize: [12, 10]
      filename: "tank_states"
      event_lines:
        - time: 0.17              # Time in hours
          label: "First valve opening event"
        - time: 1.0               # Time in hours
          label: "1 hour mark"
    fuel_flow_profile:
      enabled: true
      figsize: [14, 10]
      filename: "fuel_flow_profile"
    density_temperature:
      enabled: true
      figsize: [12, 8]
      filename: "density_temperature"
      isobar_pressures: [450, 400, 200, 100, 50, 15, 5]  # Custom isobars to show [bar]
      show_reference_pressures: true  # Show venting and minimum pressure isobars highlighted
      include_saturation_line: true   # Show liquid/vapor saturation lines
      include_isobars: true           # Show isobar lines
      arrow_position: 0.25            # Position along path for direction arrow (0.0-1.0)
      arrow_size: 1.0                 # Size multiplier for the direction arrow
      valve_marker_size: 8.0          # Size of valve opening/closing markers
    mass_flows:
      enabled: true
      figsize: [12, 6]
      filename: "mass_flows"
      include_venting_flow: true      # Show venting flow curve (true/false)
      include_coupling_flows: true
    heat_exchanger_requirements:
      enabled: false  # Optional - enable for heat exchanger analysis
      figsize: [12, 6]
      filename: "heat_exchanger_requirements"
      include_ihex: true             # Calculate and show iHEX requirements
      include_ohex: true             # Calculate and show oHEX requirements
      ohex_target_temperature: 200.0 # K - target temperature for oHEX calculations
      ohex_target_pressure: 20e5     # Pa (20 bar) - target pressure for oHEX calculations
      include_total: true            # Show total (iHEX + oHEX) curve