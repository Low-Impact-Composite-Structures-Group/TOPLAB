analysis:
  name: Coupled CH2-CCH2 Multi-Tank System
  description: 'Two-tank coupled system: CH2 (700 bar, 330K) + CCH2 (400 bar, 53K)
    with pressure compensation coupling and ATR72 mission profile'
  version: '1.0'
network:
  nodes:
  - node_id: 1
    type: tank
    description: Tank 1
    fluid: CH2
    geometry:
      phi: 3.0
      radius: 0.7
    initial_conditions:
      pressure: 70000000
      temperature: 330.0
      density: 42.0
    operating_limits:
      minimum_pressure: 1500000
      venting_pressure: 80000000
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
      insulation:
        nist_path: g10_nist
        thickness: 0.05
        heat_transfer_coefficient: 0.01
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.8
      use_density_stopping_events: true
      use_duration_stopping: true
    plotting: {}
  - node_id: 2
    type: tank
    description: Tank 2
    fluid: CcH2
    geometry:
      phi: 3.0
      mission_based_sizing: true
    initial_conditions:
      pressure: 40000000
      temperature: 53.25
      density: 80.0
    operating_limits:
      minimum_pressure: 1500000
      venting_pressure: 45000000
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
      insulation:
        nist_path: g10_nist
        thickness: 0.05
        heat_transfer_coefficient: 0.01
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.8
      use_density_stopping_events: true
      use_duration_stopping: true
    plotting: {}
  edges:
  - edge_id: ch2_cch2_pressure_compensation
    connection_type: pressure_compensation
    from_node: 1
    to_node: 2
    activation_conditions:
      pressure_open_bar: 16.0
      pressure_close_bar: 30.0
    flow_physics:
      orifice_flow:
        orifice_diameter_m: 0.002
      safety_limits:
        max_flow_rate_kg_s: 0.1
mission:
  type: discharge
  profile: atr72
  ambient_temperature: 288.15
  assigned_to_node: 2
physics:
  fluid_properties:
    use_coolprop: true
    coolprop_fluid: H2
    backup_properties:
      specific_gas_constant: 4124.0
      heat_capacity_ratio: 1.4
      kinematic_viscosity: 1.55e-06
      speed_of_sound: 1354.0
  orifice_flow:
    discharge_coefficient: 0.6
    flow_coefficient_units: dimensionless
  choked_flow:
    enable_choked_flow: true
    critical_pressure_ratio_override: null
    sonic_velocity_factor: 1.0
    choked_flow_pressure_factor: 2.0
  safety_limits:
    max_mass_transfer_fraction: 0.1
    minimum_pressure_pa: 1000.0
    maximum_velocity_ms: 2000.0
  numerical:
    pressure_tolerance_pa: 100.0
    flow_rate_tolerance_kg_s: 1e-8
    property_update_frequency: 1
solver:
  method: LSODA
  rtol: 1e-4
  atol: 1e-7
  time_step: 5.0
  max_step: 10.0
  custom_config: true
output:
  identifier: coupled_ch2_cch2_multi_tank
  save_plots: true
  plot_formats:
  - png
  - pdf
  save_data: true
  data_format: csv
  results_directory: output/results
  plots_directory: output/plots
  plots:
    style:
      use_greyscale: true
      enable_multi_tank_overlay: false
      font:
        master_size: 16
        legend_size: 16
        font_name: Cambria
    reference_lines:
      pressure:
        show_p_min: true
        show_p_vent: false
      temperature:
        show_t_ambient: false
      density:
        show_stopping_density: false
    tank_states:
      enabled: true
      figsize:
      - 12
      - 10
      filename: tank_states
      event_lines:
      - time: 0.195
        label: First valve opening event
    fuel_flow_profile:
      enabled: true
      figsize:
      - 14
      - 10
      filename: fuel_flow_profile
    density_temperature:
      enabled: true
      figsize:
      - 12
      - 8
      filename: density_temperature
      isobar_pressures:
      - 700
      - 500
      show_reference_pressures: false
      include_saturation_line: false
      include_isobars: true
      arrow_position: 0.98
      arrow_size: 1.0
      valve_marker_size: 8.0
    mass_flows:
      enabled: true
      figsize:
      - 12
      - 6
      filename: mass_flows
      include_venting_flow: true
      include_coupling_flows: true
    heat_exchanger_requirements:
      enabled: false
      figsize:
      - 12
      - 6
      filename: heat_exchanger_requirements
      include_ihex: true
      include_ohex: true
      ohex_target_temperature: 200.0
      ohex_target_pressure: 20e5
      include_total: true
