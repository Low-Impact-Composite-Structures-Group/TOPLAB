analysis_name: Stops Verification (Legacy Sequence)
description: Legacy mission_sequence-based verification configuration used for development tests.
version: '1.0'

# Legacy materials (global)
materials:
  liner:
    nist_path: aluminum_6061T6_nist
  composite:
    nist_path: carbon_epoxy_nist

# Legacy per-tank materials
tank_materials:
  '1':
    liner:
      nist_path: aluminum_6061T6_nist
      thickness: 0.001
    composite:
      nist_path: carbon_epoxy_nist
      winding_angle: 54.7
      thickness: calculated
    insulation:
      nist_path: g10_nist
      thickness: 0.05
    safety_margin: 1.25

# Legacy geometry section
geometry:
  '1':
    phi: 3.0
    initial_pressure: 2000000.0
    initial_density: 62.0
    initial_temperature: 25.0
    venting_pressure: 2200000.0
    minimum_pressure: 200000.0

# Legacy sequential mission format (used by SystemOrchestrator fallback logic)
mission_sequence:
  ambient_temperature: 288.15
  missions:
    - name: discharge
      key: discharge
      type: discharge
      profile: constant_flow
      flow_rate: 0.05
      duration: 3600
      phase: gas
    - name: dormancy
      key: dormancy
      type: dormancy
      profile: storage
      duration: 1800

solver:
  method: LSODA
  rtol: 1e-6
  atol: 1e-9
