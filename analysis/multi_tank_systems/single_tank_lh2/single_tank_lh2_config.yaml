analysis:
  name: Single Tank LH2 Benchmark
  description: Liquid hydrogen single tank validation case using orchestrated framework
  version: '1.0'
network:
  nodes:
  - node_id: 1
    type: tank
    description: Tank 1
    fluid: LH2
    geometry:
      phi: 3.0
      mission_based_sizing: true
    initial_conditions:
      pressure: 500000.0
      density: 70.0
      temperature: 20.4
    operating_limits:
      minimum_pressure: 100000.0
      venting_pressure: 1000000.0
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
        thickness: calculated
      insulation:
        thickness: 0.05
        heat_transfer_coefficient: 0.005
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.8
      use_density_stopping_events: false
    plotting: {}
  edges: []
mission:
  type: discharge
  profile: csv
  parameters:
    csv_file: ../../../src/multi_tank/missions/atr72_fuel_flows.csv
    cruise_altitude: 7010.0
    standard_temperature: 273.15
    mach_number: 0.0
    phase: gas
  ambient_temperature: 288.15
  assigned_to_node: 1
solver:
  method: LSODA
  rtol: 1e-6
  atol: 1e-9
  time_step: 1.0
  max_step: 10.0
  custom_config: false
output:
  identifier: single_tank_lh2
  save_plots: true
  plot_formats:
  - png
  - pgf
  save_data: true
  data_format: csv
  results_directory: output/results
  plots_directory: output/plots
  plots:
    figure_prefix: single_tank_lh2
    style:
      use_greyscale: true
      font:
        master_size: 16
        legend_size: 16
        font_name: Cambria
    tank_states:
      enabled: true
      figsize: [12, 10]
      filename: evolution
      xlim: null
      ylim_pressure: null
      ylim_temperature: null
      ylim_density: null
      legend_locations:
        pressure: best
        temperature: best
        density: best
