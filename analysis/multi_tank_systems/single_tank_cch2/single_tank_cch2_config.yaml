# Single Tank CCH2 Benchmark Configuration
analysis_name: "Single Tank CCH2 Benchmark"
description: "Cryocompressed hydrogen single tank validation case using orchestrated framework"
version: "1.0"

# Network topology definition
network:
  number_of_tanks: 1
  external_source: false
  external_sink: true
  tanks:
    - tank_id: 1
      tank_type: "CcH2"

# Tank geometry and initial conditions
geometry:
  1:
    phi: 3.0                             # Length/radius ratio (L/R)
    initial_pressure: 400e5              # Pa (400 bar - cryocompressed storage)
    initial_density: 80.0               # kg/m³ (increased for sufficient fuel capacity)
    venting_pressure: 450e5              # Pa (450 bar - venting pressure)
    minimum_pressure: 15e5               # Pa (15 bar - minimum allowable pressure)

# Material specifications with NIST temperature-dependent properties
materials:
  liner:
    nist_path: "aluminum_6061T6_nist"    # Path to NIST materials library
    thickness: 0.001                     # m (5mm aluminum liner)
  composite:
    nist_path: "carbon_epoxy_nist"                # Path to NIST materials library
    winding_angle: 54.7                  # degrees (optimal winding angle)
    thickness: "calculated"              # Calculated from pressure requirements
  insulation:
    thickness: 0.050                     # m (50mm insulation layer)
    heat_transfer_coefficient: 0.025     # W/m²K (vacuum insulation)
  safety_margin: 1.25                    # Structural design safety factor

# Mission profile configuration
mission:
  type: "discharge"                      # Mission type: discharge | refuel | dormancy
  profile: "atr72"                       # Profile: atr72 | constant_flow | custom
  ambient_temperature: 288.15            # K (ambient conditions)
  # No additional parameters needed for atr72 profile
  # For constant_flow: add flow_rate (kg/s), duration (s)
  # For custom: add sections (list of {duration, flow_rate})

# Stopping criteria
stopping_criteria:
  minimum_density: 5.8                  # kg/m³ (CCH2 minimum density requirement)
  use_density_stopping_events: false    # Use pressure-based stopping instead

# Coupling rules (empty for single tank, but structure ready for multi-tank)
coupling_rules: []

# Solver configuration
solver:
  method: "LSODA"                        # Primary integration method
  rtol: 1e-6                            # Relative tolerance
  atol: 1e-9                            # Absolute tolerance
  time_step: 0.1                        # Base time step [s]
  max_step: 10.0                        # Maximum step size [s]
  custom_config: false                   # true if custom solver precision needed (handled in driver)

# Output settings
output:
  identifier: "single_tank_cch2"         # Identifier string appended to file names
  save_plots: true
  plot_formats: ["png", "pdf"]
  save_data: true
  data_format: "csv"
  results_directory: "output/results"
  plots_directory: "output/plots"

  # Plotting handled by DelftColourPlotter in SystemOrchestrator.generate_plots()

  # Plot configurations
  plots:
    # Plotting style configuration
    style:
      use_greyscale: true           # Enable greyscale plotting mode
      # Font configuration
      font:
        master_size: 16                # Master font size for axis labels, titles, etc.
        legend_size: 8                # Font size for legends and isobar callouts
        font_name: "Cambria"           # Font family name

    # Reference lines configuration
    reference_lines:
      pressure:
        show_p_min: true           # Show minimum allowable pressure line
        show_p_vent: true          # Show maximum allowable / venting pressure line
      temperature:
        show_t_ambient: false       # Show ambient temperature line
      density:
        show_stopping_density: false # Show stopping density line

    tank_states:
      enabled: true
      figsize: [12, 10]
      filename: "tank_states"
      event_lines:
        - time: 0.185               # Time in hours (adjusted for single tank)
          label: "IHEX activation"
    fuel_flow_profile:
      enabled: true
      figsize: [14, 10]
      filename: "fuel_flow_profile"
    density_temperature:
      enabled: true
      figsize: [12, 8]
      filename: "density_temperature"
      isobar_pressures: [450, 400, 200, 100, 50, 15, 5]  # Custom isobars to show [bar]
      show_reference_pressures: true  # Show venting and minimum pressure isobars highlighted
      include_saturation_line: true   # Show liquid/vapor saturation lines
      include_isobars: true           # Show isobar lines
      arrow_position: 0.25            # Position along path for direction arrow (0.0-1.0)
      arrow_size: 1.0                 # Size multiplier for the direction arrow
      valve_marker_size: 8.0          # Size of valve opening/closing markers
    mass_flows:
      enabled: true
      figsize: [12, 6]
      filename: "mass_flows"
      include_venting_flow: true      # Show venting flow curve (true/false)
    heat_exchanger_requirements:
      enabled: true
      figsize: [12, 6]
      filename: "heat_exchanger_requirements"
      include_ihex: true             # Calculate and show iHEX requirements
      include_ohex: true             # Calculate and show oHEX requirements
      ohex_target_temperature: 200.0 # K - target temperature for oHEX calculations
      ohex_target_pressure: 20e5     # Pa (20 bar) - target pressure for oHEX calculations
      include_total: true            # Show total (iHEX + oHEX) curve
