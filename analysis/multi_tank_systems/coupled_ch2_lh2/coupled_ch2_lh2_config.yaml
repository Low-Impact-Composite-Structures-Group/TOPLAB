analysis:
  name: Coupled CH2-LH2 Multi-Tank System (Feedforward)
  description: 'CH2→LH2 feedforward pressure enforcement: per-step algebraic flow to match required pressure'
  version: '1.0'
network:
  nodes:
  - node_id: 1
    type: tank
    description: Tank 1
    fluid: CH2
    geometry:
      phi: 3.0
      radius: 1.1
    initial_conditions:
      pressure: 100000000.0
      temperature: 288.15
      density: 60.0
    operating_limits:
      minimum_pressure: 100000.0
      venting_pressure: 110000000.0
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
      insulation:
        thickness: 0.05
        heat_transfer_coefficient: 50.0
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.0
      use_density_stopping_events: true
      use_duration_stopping: true
    plotting: {}
  - node_id: 2
    type: tank
    description: Tank 2
    fluid: LH2
    geometry:
      phi: 3.0
      mission_based_sizing: true
    initial_conditions:
      pressure: 1000000.0
      temperature: 25.0
      density: 70.0
    operating_limits:
      minimum_pressure: 100000.0
      venting_pressure: 1500000.0
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
      insulation:
        thickness: 0.05
        heat_transfer_coefficient: 0.025
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.0
      use_density_stopping_events: true
      use_duration_stopping: true
    plotting: {}
  edges:
  - edge_id: ch2_lh2_feedforward
    connection_type: feedforward_pressure_enforcer
    description: 'Per-derivative feedforward: invert mdot_in to match required LH2 pressure'
    from_node: 1
    to_node: 2
    control_parameters:
      safety_mass_fraction_per_s: 0.10
      # REQUIRED: Control timing
      enforcement_horizon_s: 1.0   # Prediction horizon - should be at least 2× solver timestep
      # OPTIONAL: Legacy parameter (used only for bisection upper bound)
      bracket_margin: 1.15         # narrower bracket reduces overshoot at saturation
      # Pressure targeting
      overpressure_margin_bar: 1.0 # Buffer above required pressure to avoid undershoot
      max_target_pressure_bar: 20.0 # Hard ceiling - never exceed Tank 2 safe operating pressure
      # Actuator dynamics
      valve_time_constant_s: 0.2   # First-order valve response time constant
      activation_softness_bar: 0.5 # Smooth gate transition width around target pressure (0 = hard switch)
    flow_parameters:
      max_flow_rate_kg_s: 0.6       # Theoretical max (unused - physics-based capacity dominates)
      orifice_diameter_m: 0.003
    discharge_piping:
      diameter_m: 0.01
      length_m: 10.0
      roughness_m: 1.5e-06
      loss_coefficient: 1.0
      choked_flow_enabled: true

mission:
  type: discharge
  profile: atr72
  ambient_temperature: 288.15
  assigned_to_node: 2

physics:
  fluid_properties:
    use_coolprop: true
    coolprop_fluid: H2
    backup_properties:
      specific_gas_constant: 4124.0
      heat_capacity_ratio: 1.4
      kinematic_viscosity: 1e-7
      speed_of_sound: 1000.0
  orifice_flow:
    discharge_coefficient: 0.6
    flow_coefficient_units: dimensionless
  choked_flow:
    enable_choked_flow: true
    sonic_velocity_factor: 1.0
    choked_flow_pressure_factor: 2.0
    velocity_choked_fraction: 0.5
  pipe_flow:
    atmospheric_pressure: 101325.0
    reynolds_transition: 2300.0
    friction_correlations:
      laminar_factor: 64.0
      turbulent_correlation: blasius
      turbulent_factor: 0.316
      turbulent_exponent: 0.25
    default_roughness: 1.5e-06
  safety_limits:
    minimum_pressure_pa: 1000.0
    maximum_velocity_ms: 2000.0
  numerical:
    pressure_tolerance_pa: 1000.0
    flow_rate_tolerance_kg_s: 1e-5
    property_update_frequency: 1

solver:
  method: LSODA
  rtol: 5e-7
  atol: 5e-8
  time_step: 0.5
  max_step: 5.0
  custom_config: true

output:
  identifier: coupled_ch2_lh2_feedforward
  save_plots: true
  plot_formats: [png, pdf]
  save_data: true
  data_format: csv
  results_directory: output/results
  plots_directory: output/plots
  plots:
    figure_prefix: coupled_ch2_lh2
    style:
      use_greyscale: true
      enable_multi_tank_overlay: false
      font:
        master_size: 16
        legend_size: 16
        font_name: Cambria
    reference_lines:
      pressure:
        show_p_min: true
        show_p_vent: false
      temperature:
        show_t_ambient: false
      density:
        show_stopping_density: false
    tank_states:
      enabled: true
      figsize: [12, 10]
      filename: evolution
      xlim: null
      ylim_pressure: null
      ylim_temperature: null
      ylim_density: null
      legend_locations:
        pressure: best
        temperature: best
        density: best
    fuel_flow_profile:
      enabled: true
      figsize: [14, 10]
      filename: fuel_flow_profile
    density_temperature:
      enabled: true
      figsize: [12, 8]
      filename: density_temperature
      isobar_pressures: [700, 500, 300, 100, 20]
      show_reference_pressures: false
      include_saturation_line: true
      include_isobars: true
      arrow_position: 0.98
      arrow_size: 1.0
      valve_marker_size: 8.0
      legend_location: upper right
    pressure_requirements:
      enabled: true
      figsize: [14, 10]
      filename: pressure_requirements
    mass_flows:
      enabled: true
      filename: mass_flows
      include_venting_flow: true
      include_coupling_flows: true
      xlim: null
      ylim: null
      legend_location: best
    heat_exchanger_requirements:
      enabled: true
      figsize: [12, 6]
      filename: hex
      include_ihex: true
      include_ohex: true
      ohex_target_temperature: 200.0
      ohex_target_pressure: 20e5
      include_total: true
      xlim: null
      ylim: null
      legend_location: best
