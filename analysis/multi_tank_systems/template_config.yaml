# ============================================================================
# MULTI-TANK HYDROGEN STORAGE SYSTEM CONFIGURATION TEMPLATE
# ============================================================================
# This template demonstrates the complete configuration structure for both
# single-tank and multi-tank hydrogen storage analyses using the network-based
# configuration format.
#
# REQUIRED vs OPTIONAL sections are marked below.
# SINGLE-TANK vs MULTI-TANK requirements are also indicated.
#
# Version: 1.0
# Compatible with: System Orchestrator v2.0+
# ============================================================================

# ----------------------------------------------------------------------------
# ANALYSIS METADATA (REQUIRED - all systems)
# ----------------------------------------------------------------------------
# High-level information about the analysis being performed
analysis:
  name: Template Analysis Name                    # REQUIRED: Descriptive name
  description: Brief description of the analysis  # REQUIRED: What this analysis does
  version: '1.0'                                  # REQUIRED: Configuration version

# ----------------------------------------------------------------------------
# NETWORK DEFINITION (REQUIRED - all systems)
# ----------------------------------------------------------------------------
# Graph-based representation of the tank system
# - nodes: Individual tanks in the system
# - edges: Connections/couplings between tanks
network:
  # --------------------------------------------------------------------------
  # NODES: Tank Definitions (REQUIRED - at least 1 node)
  # --------------------------------------------------------------------------
  nodes:
    # ========================================================================
    # EXAMPLE NODE 1: High-Pressure Gaseous Hydrogen (CH2) Tank
    # ========================================================================
  - node_id: 1                                    # REQUIRED: Unique integer identifier
    type: tank                                    # REQUIRED: Must be "tank"
    description: Primary supply tank              # OPTIONAL: Human-readable description

    # Fluid type - REQUIRED: Must be valid CoolProp fluid or custom type
    # Valid options: CH2, CcH2, LH2, SLH2, hydrogen (use CH2 for gaseous)
    fluid: CH2

    # ------------------------------------------------------------------------
    # GEOMETRY: Tank sizing parameters (REQUIRED)
    # ------------------------------------------------------------------------
    geometry:
      # Aspect ratio (length/diameter) - REQUIRED
      phi: 3.0

      # Tank sizing method - choose ONE of the following:
      # Option 1: Mission-based sizing (let system calculate volume)
      mission_based_sizing: true                  # For single-tank or target tank

      # Option 2: Fixed radius (explicit volume definition)
      # radius: 0.7                               # [m] Uncomment for fixed size

      # Option 3: Explicit volume and diameter (rarely used)
      # volume: 0.5                               # [m³]
      # diameter: 1.4                             # [m]

    # ------------------------------------------------------------------------
    # INITIAL CONDITIONS: Tank state at t=0 (REQUIRED)
    # ------------------------------------------------------------------------
    initial_conditions:
      pressure: 70000000.0                        # [Pa] REQUIRED: Initial pressure
      temperature: 330.0                          # [K] REQUIRED: Initial temperature
      density: 42.0                               # [kg/m³] REQUIRED: Initial density

      # NOTE: These three properties must be thermodynamically consistent!
      # Use CoolProp to verify: PropsSI('D', 'P', P, 'T', T, 'hydrogen')

    # ------------------------------------------------------------------------
    # OPERATING LIMITS: Safety and control bounds (REQUIRED)
    # ------------------------------------------------------------------------
    operating_limits:
      minimum_pressure: 1500000.0                 # [Pa] REQUIRED: Min operating pressure
      venting_pressure: 80000000.0                # [Pa] REQUIRED: Overpressure relief valve

      # Optional: Additional limits (uncomment if needed)
      # maximum_temperature: 400.0                # [K] Max allowable temperature
      # minimum_density: 5.0                      # [kg/m³] Min density for operation

    # ------------------------------------------------------------------------
    # MATERIALS: Structural and insulation materials (REQUIRED)
    # ------------------------------------------------------------------------
    materials:
      # Liner material (REQUIRED)
      liner:
        nist_path: aluminum_6061T6_nist           # REQUIRED: NIST material identifier
        thickness: 0.001                          # [m] REQUIRED: Wall thickness

      # Composite overwrap (REQUIRED for Type III/IV tanks)
      composite:
        nist_path: carbon_epoxy_nist              # REQUIRED: Composite material
        winding_angle: 54.7                       # [deg] REQUIRED: Fiber winding angle
        thickness: calculated                     # REQUIRED: Use "calculated" for auto-sizing
                                                  # or provide numeric value [m]

      # Insulation (REQUIRED)
      insulation:
        nist_path: g10_nist                       # OPTIONAL: NIST material (for MLI or foam)
        thickness: 0.05                           # [m] REQUIRED: Insulation thickness
        heat_transfer_coefficient: 0.01           # [W/m²·K] REQUIRED: Effective U-value

        # NOTE: For gaseous H2, use higher U (e.g., 50 W/m²·K)
        #       For cryo systems, use lower U (e.g., 0.005-0.05 W/m²·K)

      # Safety margin for composite sizing (REQUIRED)
      safety_margin: 1.25                         # REQUIRED: Pressure vessel safety factor

    # ------------------------------------------------------------------------
    # STOPPING CRITERIA: When to terminate simulation (REQUIRED)
    # ------------------------------------------------------------------------
    stopping_criteria:
      minimum_density: 5.8                        # [kg/m³] REQUIRED: Stop when density drops below
      use_density_stopping_events: true           # REQUIRED: Enable density-based termination
      use_duration_stopping: true                 # REQUIRED: Enable time-based termination

      # Optional: Pressure-based stopping
      # minimum_pressure_stop: 1000000.0          # [Pa] Alternative stopping criterion

    # ------------------------------------------------------------------------
    # PLOTTING: Node-specific plot settings (OPTIONAL)
    # ------------------------------------------------------------------------
    plotting: {}                                  # Empty for now, future expansion

    # ========================================================================
    # EXAMPLE NODE 2: Cryocompressed Hydrogen (CCH2) Tank
    # ========================================================================
  - node_id: 2                                    # REQUIRED: Unique ID (must differ from node 1)
    type: tank
    description: Cryogenic storage tank
    fluid: CcH2                                   # Cryocompressed hydrogen

    geometry:
      phi: 3.0
      mission_based_sizing: true                  # This will be the "mission tank"

    initial_conditions:
      pressure: 40000000.0                        # [Pa] 400 bar initial pressure
      temperature: 53.25                          # [K] Just above saturation at 400 bar
      density: 80.0                               # [kg/m³] Dense cryogenic state

    operating_limits:
      minimum_pressure: 1500000.0                 # [Pa] 15 bar minimum
      venting_pressure: 45000000.0                # [Pa] 450 bar relief

    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
        thickness: calculated
      insulation:
        nist_path: g10_nist
        thickness: 0.05
        heat_transfer_coefficient: 0.01           # Better insulation for cryo
      safety_margin: 1.25

    stopping_criteria:
      minimum_density: 5.8
      use_density_stopping_events: true
      use_duration_stopping: true

    plotting: {}

  # --------------------------------------------------------------------------
  # EDGES: Inter-Tank Couplings (OPTIONAL - only for multi-tank systems)
  # --------------------------------------------------------------------------
  # Define connections between tanks for mass/energy transfer
  # Leave as empty list [] for single-tank systems
  edges:
    # ========================================================================
    # EXAMPLE EDGE 1: Pressure-Triggered Valve (Discrete On/Off)
    # ========================================================================
  - edge_id: ch2_cch2_pressure_compensation       # REQUIRED: Unique edge identifier
    connection_type: pressure_compensation        # REQUIRED: Valve/coupling type
    description: Pressure-triggered discrete valve # OPTIONAL: What this coupling does

    # Connection topology (REQUIRED)
    from_node: 1                                  # REQUIRED: Source tank node_id
    to_node: 2                                    # REQUIRED: Target tank node_id

    # Activation conditions for discrete valves (REQUIRED for pressure_compensation)
    activation_conditions:
      pressure_open_bar: 16.0                     # [bar] Valve opens when target ≤ this
      pressure_close_bar: 30.0                    # [bar] Valve closes when target ≥ this

    # Flow physics parameters (OPTIONAL - per-edge overrides)
    flow_physics:
      orifice_flow:
        orifice_diameter_m: 0.002                 # [m] Orifice/valve diameter
      safety_limits:
        max_flow_rate_kg_s: 0.1                   # [kg/s] Maximum flow rate limit

    # ========================================================================
    # EXAMPLE EDGE 2: Feedforward Pressure Controller (Continuous)
    # ========================================================================
  - edge_id: ch2_lh2_feedforward
    connection_type: feedforward_pressure_enforcer # Continuous pressure control
    description: Feedforward controller to maintain target tank pressure
    from_node: 1
    to_node: 2

    # Control parameters for feedforward controller (REQUIRED for feedforward type)
    control_parameters:
      # Source constraints
      min_source_pressure_bar: 15.0               # [bar] Min source pressure to allow flow
      safety_mass_fraction_per_s: 0.10            # [1/s] Max fraction of source mass per second

      # Bisection search parameters (for inverting derivatives)
      bracket_margin: 1.15                        # Bracket width multiplier
      max_bisection_iters: 14                     # Maximum iterations for convergence
      tol_pressure_bar: 0.01                      # [bar] Pressure tolerance

      # Feedforward tuning parameters
      enforcement_horizon_s: 0.30                 # [s] Look-ahead time horizon
      overpressure_margin_bar: 0.5                # [bar] Bias above target pressure
      mdot_bias_kg_s: 0.0006                      # [kg/s] Minimum flow to prevent valve closure
      soft_saturation_rel: 0.10                   # Soft saturation factor (0-1)

      # Flow floor parameters (prevent zero-flow dropout)
      min_flow_floor_kg_s: 0.002                  # [kg/s] Absolute minimum flow
      min_flow_floor_rel_cap: 0.05                # Relative to capacity minimum

    # Flow capacity parameters (REQUIRED for feedforward)
    flow_parameters:
      max_flow_rate_kg_s: 0.6                     # [kg/s] Maximum flow capacity
      orifice_diameter_m: 0.0035                  # [m] Effective orifice diameter

    # Discharge piping parameters (OPTIONAL - for pressure drop calculations)
    discharge_piping:
      diameter_m: 0.005                           # [m] Pipe inner diameter
      length_m: 1.0                               # [m] Total pipe length
      roughness_m: 1.5e-06                        # [m] Surface roughness
      loss_coefficient: 1.0                       # [-] Minor loss coefficient (fittings, bends)
      choked_flow_enabled: true                   # Enable choked flow modeling

# ----------------------------------------------------------------------------
# MISSION PROFILE (REQUIRED - all systems)
# ----------------------------------------------------------------------------
# Defines the operational scenario and which tank delivers fuel
mission:
  type: discharge                                 # REQUIRED: "discharge" or "refuel"
  profile: atr72                                  # REQUIRED: Mission profile name
                                                  # Options: atr72, constant_flow, custom
  ambient_temperature: 288.15                     # [K] REQUIRED: External temperature
  assigned_to_node: 2                             # REQUIRED: Which tank supplies mission
                                                  # For single-tank: use node_id 1
                                                  # For multi-tank: typically the target tank

# ----------------------------------------------------------------------------
# PHYSICS CONFIGURATION (REQUIRED for multi-tank, OPTIONAL for single-tank)
# ----------------------------------------------------------------------------
# Global physics parameters for flow calculations and fluid properties
# ONLY REQUIRED if network.edges is non-empty (i.e., multi-tank system)
physics:
  # --------------------------------------------------------------------------
  # Fluid Properties (REQUIRED for multi-tank)
  # --------------------------------------------------------------------------
  fluid_properties:
    use_coolprop: true                            # REQUIRED: Must be true (no fallbacks!)
    coolprop_fluid: H2                            # REQUIRED: CoolProp fluid identifier

    # Backup properties - DEPRECATED, do not use
    # These are here for legacy compatibility only
    backup_properties:
      specific_gas_constant: 4124.0               # [J/kg·K]
      heat_capacity_ratio: 1.4                    # [-]
      kinematic_viscosity: 1.55e-06               # [m²/s]
      speed_of_sound: 1354.0                      # [m/s]

  # --------------------------------------------------------------------------
  # Orifice Flow (REQUIRED for multi-tank with orifice-based valves)
  # --------------------------------------------------------------------------
  orifice_flow:
    discharge_coefficient: 0.6                    # REQUIRED: Cd for orifice equation
    flow_coefficient_units: dimensionless         # REQUIRED: Must be "dimensionless"

  # --------------------------------------------------------------------------
  # Choked Flow (OPTIONAL - recommended for high-pressure systems)
  # --------------------------------------------------------------------------
  choked_flow:
    enable_choked_flow: true                      # Enable sonic velocity limiting
    critical_pressure_ratio_override: null        # null = auto-calculate from gamma
    sonic_velocity_factor: 1.0                    # Multiplier for sonic velocity
    choked_flow_pressure_factor: 2.0              # Pressure ratio threshold
    velocity_choked_fraction: 0.5                 # Fraction of sonic velocity for choking

  # --------------------------------------------------------------------------
  # Pipe Flow (OPTIONAL - only needed if discharge_piping is defined)
  # --------------------------------------------------------------------------
  pipe_flow:
    atmospheric_pressure: 101325.0                # [Pa] Reference pressure
    reynolds_transition: 2300.0                   # [-] Laminar/turbulent transition Re
    friction_correlations:
      laminar_factor: 64.0                        # Laminar friction factor (64/Re)
      turbulent_correlation: blasius              # Options: blasius, colebrook
      turbulent_factor: 0.316                     # Blasius coefficient
      turbulent_exponent: 0.25                    # Blasius exponent
    default_roughness: 1.5e-06                    # [m] Default surface roughness

  # --------------------------------------------------------------------------
  # Safety Limits (REQUIRED for multi-tank)
  # --------------------------------------------------------------------------
  safety_limits:
    max_mass_transfer_fraction: 0.1               # [1/s] Max fraction of tank mass per second
    minimum_pressure_pa: 1000.0                   # [Pa] Absolute minimum pressure
    maximum_velocity_ms: 2000.0                   # [m/s] Maximum flow velocity

  # --------------------------------------------------------------------------
  # Numerical Parameters (OPTIONAL - defaults usually sufficient)
  # --------------------------------------------------------------------------
  numerical:
    pressure_tolerance_pa: 1000.0                 # [Pa] Pressure convergence tolerance
    flow_rate_tolerance_kg_s: 1e-5                # [kg/s] Flow rate convergence tolerance
    property_update_frequency: 1                  # Update properties every N time steps

# ----------------------------------------------------------------------------
# SOLVER CONFIGURATION (REQUIRED - all systems)
# ----------------------------------------------------------------------------
# ODE solver settings for time integration
solver:
  method: LSODA                                   # REQUIRED: Solver algorithm
                                                  # Options: LSODA, RK45, Radau, DOP853, BDF
  rtol: 1e-4                                      # REQUIRED: Relative tolerance
  atol: 1e-7                                      # REQUIRED: Absolute tolerance
  time_step: 5.0                                  # [s] REQUIRED: Initial time step
  max_step: 10.0                                  # [s] REQUIRED: Maximum time step
  custom_config: true                             # REQUIRED: true for multi-tank, false for single

# ----------------------------------------------------------------------------
# OUTPUT CONFIGURATION (REQUIRED - all systems)
# ----------------------------------------------------------------------------
# Results storage and plotting settings
output:
  # File naming and storage
  identifier: template_analysis                   # REQUIRED: Base name for output files
  save_plots: true                                # REQUIRED: Whether to save plots
  plot_formats: [png, pdf]                        # REQUIRED: List of plot formats
  save_data: true                                 # REQUIRED: Whether to save data
  data_format: csv                                # REQUIRED: Data format (csv recommended)
  results_directory: output/results               # REQUIRED: Where to save CSV files
  plots_directory: output/plots                   # REQUIRED: Where to save plot files

  # --------------------------------------------------------------------------
  # PLOTTING CONFIGURATION (OPTIONAL - customize as needed)
  # --------------------------------------------------------------------------
  plots:
    # ------------------------------------------------------------------------
    # Global Plot Style
    # ------------------------------------------------------------------------
    style:
      use_greyscale: true                         # Black & white for publications
      enable_multi_tank_overlay: false            # Overlay all tanks on one plot
      font:
        master_size: 16                           # Base font size [pt]
        legend_size: 16                           # Legend font size [pt]
        font_name: Cambria                        # Font family

    # ------------------------------------------------------------------------
    # Reference Lines (OPTIONAL)
    # ------------------------------------------------------------------------
    reference_lines:
      pressure:
        show_p_min: true                          # Show minimum pressure line
        show_p_vent: true                         # Show venting pressure line
      temperature:
        show_t_ambient: false                     # Show ambient temperature line
      density:
        show_stopping_density: false              # Show stopping density line

    # ------------------------------------------------------------------------
    # Individual Plot Configurations
    # Each plot can be enabled/disabled and customized
    # ------------------------------------------------------------------------

    # Tank States: Pressure, temperature, density vs time
    tank_states:
      enabled: true                               # REQUIRED: Enable this plot
      figsize: [12, 10]                           # [width, height] in inches
      filename: tank_states                       # Output filename (no extension)
      event_lines:                                # Optional: Mark specific events
      - time: 0.0                                 # [hrs] Time of event
        label: Simulation start                   # Label for event marker

    # Fuel Flow Profile: Mass flow rate delivered to mission
    fuel_flow_profile:
      enabled: true
      figsize: [14, 10]
      filename: fuel_flow_profile

    # Density-Temperature Phase Diagram: Thermodynamic state trajectory
    density_temperature:
      enabled: true
      figsize: [12, 8]
      filename: density_temperature
      isobar_pressures: [700, 500, 300, 100, 20]  # [bar] Pressure contours to show
      show_reference_pressures: true              # Mark p_min, p_vent on diagram
      include_saturation_line: true               # Show liquid-vapor boundary
      include_isobars: true                       # Show constant pressure lines
      arrow_position: 0.98                        # Position of trajectory arrows [0-1]
      arrow_size: 1.0                             # Arrow size multiplier
      valve_marker_size: 8.0                      # Size of valve event markers

    # Mass Flows: All mass flow rates (venting, coupling, mission)
    mass_flows:
      enabled: true
      figsize: [12, 6]
      filename: mass_flows
      include_venting_flow: true                  # Show venting flow rate
      include_coupling_flows: true                # Show inter-tank flows (multi-tank only)

    # Heat Exchanger Requirements: iHEX and oHEX power requirements
    heat_exchanger_requirements:
      enabled: true
      figsize: [12, 6]
      filename: heat_exchanger_requirements
      include_ihex: true                          # Internal heat exchanger
      include_ohex: true                          # Orthogonal heat exchanger
      ohex_target_temperature: 200.0              # [K] Target outlet temperature
      ohex_target_pressure: 20e5                  # [Pa] Target outlet pressure
      include_total: true                         # Show total HEX power

    # Pressure Requirements: For feedforward controllers (multi-tank only)
    pressure_requirements:
      enabled: false                              # Usually only for feedforward cases
      figsize: [14, 10]
      filename: pressure_requirements

# ============================================================================
# END OF TEMPLATE
# ============================================================================
#
# USAGE NOTES:
#
# 1. SINGLE-TANK SYSTEM:
#    - Define one node in network.nodes
#    - Set edges: [] (empty list)
#    - Omit physics: section (not required)
#    - Set mission.assigned_to_node: 1
#    - Set solver.custom_config: false
#
# 2. MULTI-TANK SYSTEM:
#    - Define 2+ nodes in network.nodes
#    - Define edges in network.edges with appropriate coupling types
#    - MUST include physics: section with all required subsections
#    - Set mission.assigned_to_node to the tank that delivers fuel
#    - Set solver.custom_config: true
#
# 3. VALIDATION:
#    - Ensure P, T, ρ are thermodynamically consistent at t=0
#    - Verify all NIST materials exist in your materials database
#    - Check that mission profile exists in mission definitions
#    - Confirm all node_ids referenced in edges actually exist
#
# 4. COMMON ERRORS:
#    - Missing physics: section when edges is non-empty
#    - Inconsistent initial thermodynamic state
#    - mission.assigned_to_node referencing non-existent node
#    - Using both mission_based_sizing: true on multiple nodes
#      (only one tank should be auto-sized per mission)
#
# For more information, see the README in analysis/multi_tank_systems/
# ============================================================================
