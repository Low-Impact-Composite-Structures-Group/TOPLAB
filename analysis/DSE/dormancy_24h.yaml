analysis:
  name: DSE — LH2 Composite Tank — Dormancy (24h)
  description: >-
    Single LH2 tank dormancy (no commanded outflow) for 24 hours.
    Uses the same explicit tank radius as the discharge analysis.
  version: '1.0'

network:
  nodes:
  - node_id: 1
    type: tank
    description: LH2 tank (composite wall)
    fluid: SLH2
    geometry:
      phi: 3.0
      radius: 0.90
    initial_conditions:
      pressure: 800000.0
      temperature: 22.0
      density: 70.0
    operating_limits:
      minimum_pressure: 500000.0
      venting_pressure: 1200000.0
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
        thickness: calculated
      insulation:
        thickness: 0.10
        heat_transfer_coefficient: 0.005
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 5.0
      use_density_stopping_events: true
      use_duration_stopping: true
    plotting: {}

  - node_id: fuel_recipient
    type: sink
    description: Demand endpoint (unused)

  - node_id: atmosphere
    type: sink
    description: Vent / ambient environment

  edges:
  - edge_id: tank_to_atmosphere
    connection_type: discharge
    description: Vent connection to atmosphere sink (pressure relief).
    participants:
      source: 1
      target: atmosphere

  - edge_id: tank_to_fuel_recipient_stub
    connection_type: discharge
    description: Discharge edge stub (no commanded flow during dormancy).
    participants:
      source: 1
      target: fuel_recipient

mission:
  type: dormancy
  profile: csv
  parameters:
    csv_file: mission_dormancy_24h.csv
    cruise_altitude: 0.0
    standard_temperature: 293.15
    mach_number: 0.0
    phase: gas
  ambient_temperature: 293.15
  assigned_to_node: 1

solver:
  method: LSODA
  rtol: 1.0e-6
  atol: 1.0e-9
  time_step: 10.0
  max_step: 60.0

output:
  identifier: dse_lh2_composite_dormancy_24h
  save_plots: false
  save_data: true
  data_format: csv
  results_directory: output/results
  plots_directory: output/plots
