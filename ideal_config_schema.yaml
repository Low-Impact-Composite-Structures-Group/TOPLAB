# Ideal Multi-Tank Analysis Configuration Schema
# This represents the intuitive structure that reflects the actual system architecture
# Date: October 13, 2025

# Analysis metadata
analysis:
  name: "Coupled CH2-LH2 Multi-Tank System"
  description: "Two-tank coupled system: CH2 (700 bar, 330K) pressurizes LH2 (3-15 bar, 20K) for mission discharge with PID-controlled coupling"
  version: "2.0"
  author: "Analysis Framework Team"

# Network topology - this represents the actual physical system
network:
  # Nodes are the system components (tanks, sources, sinks)
  nodes:
    - node_id: 1
      type: "tank"
      fluid: "CH2"
      description: "High pressure compressed hydrogen storage tank"

      # Geometric properties
      geometry:
        phi: 3.0                    # Length/radius ratio (L/R)
        radius: 0.8                 # m - tank radius
        # Volume and length calculated from phi and radius

      # Initial state
      initial_conditions:
        pressure: 100000000         # Pa (700 bar)
        temperature: 288.15         # K (room temperature)
        density: 60.0              # kg/m³

      # Operating limits and safety parameters
      operating_limits:
        minimum_pressure: 100000    # Pa (1 bar minimum)
        venting_pressure: 110000000 # Pa (1100 bar venting)
        maximum_temperature: 350.0  # K (safety limit)
        minimum_temperature: 200.0  # K (avoid extreme cooling)

      # Material configuration
      materials:
        liner:
          nist_path: "aluminum_6061T6_nist"
          thickness: 0.001          # m (1mm aluminum liner)
        composite:
          nist_path: "carbon_epoxy_nist"
          winding_angle: 54.7       # degrees (optimal winding angle)
        insulation:
          thickness: 0.050          # m (50mm insulation)
          heat_transfer_coefficient: 50  # W/m²K
        safety_margin: 1.25         # Structural design safety factor

      # Tank-specific stopping criteria
      stopping_criteria:
        minimum_density: 5.0        # kg/m³
        use_density_stopping: true
        use_pressure_stopping: false
        minimum_mass_fraction: 0.1  # Stop when 10% of initial mass remains

      # Tank-specific plotting options
      plotting:
        show_reference_pressures: true
        show_operating_limits: true
        highlight_stopping_criteria: true
        color_scheme: "blue"        # For multi-tank plots

    - node_id: 2
      type: "tank"
      fluid: "LH2"
      description: "Liquid hydrogen mission fuel tank"

      geometry:
        phi: 3.0
        # Use mission-based sizing instead of fixed radius
        mission_based_sizing: true  # Size based on mission requirements

      initial_conditions:
        pressure: 1000000           # Pa (8 bar)
        temperature: 23.5           # K (saturated liquid at 8 bar)
        density: 68.0              # kg/m³

      operating_limits:
        minimum_pressure: 200000    # Pa (3 bar minimum)
        venting_pressure: 1500000   # Pa (15 bar venting)
        maximum_temperature: 30.0   # K (avoid excessive heating)
        minimum_temperature: 20.0   # K (liquid hydrogen range)

      materials:
        liner:
          nist_path: "aluminum_6061T6_nist"
          thickness: 0.001
        composite:
          nist_path: "carbon_epoxy_nist"
          winding_angle: 54.7
        insulation:
          thickness: 0.050
          heat_transfer_coefficient: 0.025  # Better insulation for LH2
        safety_margin: 1.25

      stopping_criteria:
        minimum_density: 5.0
        use_density_stopping: true
        use_duration_stopping: true  # Stop when mission duration reached
        mission_completion_threshold: 0.95  # 95% mission completion

      plotting:
        show_reference_pressures: false  # Different per tank
        show_saturation_line: true       # LH2-specific
        include_isobars: true
        isobar_pressures: [5, 15, 100, 400]  # bar
        color_scheme: "red"

  # Edges represent connections/couplings between nodes
  edges:
    - edge_id: "ch2_lh2_coupling"
      from_node: 1                  # CH2 tank
      to_node: 2                    # LH2 tank
      connection_type: "mission_adaptive_pressurization"
      description: "PID-controlled variable flow coupling for mission-adaptive pressurization"

      # Physical piping properties
      piping:
        diameter_m: 0.005           # 5mm pipe diameter
        length_m: 1.0               # 1m pipe length
        roughness_m: 1.5e-6         # Stainless steel roughness
        loss_coefficient: 1.0       # Minor losses
        insulation_thickness: 0.01  # 10mm pipe insulation

      # Flow physics parameters specific to this connection
      flow_physics:
        # Orifice/valve characteristics
        orifice_flow:
          discharge_coefficient: 0.6
          orifice_diameter_m: 0.008  # 8mm orifice

        # Choked flow parameters
        choked_flow:
          enable_choked_flow: false
          critical_pressure_ratio_override: 0.528

        # Safety limits for this connection
        safety_limits:
          max_flow_rate_kg_s: 0.11   # 110 g/s maximum
          min_source_pressure_bar: 15.0
          max_pressure_drop_bar: 50.0

      # Control system parameters
      control_parameters:
        controller_type: "PID"
        pressure_margin_bar: 1.0      # Margin above mission requirements
        minimum_safety_pressure_bar: 3.5

        # PID gains
        pid_kp: 0.2                   # Proportional gain
        pid_ki: 0.02                  # Integral gain
        pid_kd: 0.05                  # Derivative gain

        # Control limits
        max_pressurization_rate_kg_s: 0.08
        control_frequency_hz: 10.0    # Control update frequency

# Mission profile assignment and configuration
mission:
  type: "discharge"                 # Mission type: discharge | refuel | dormancy
  profile: "atr72"                  # Import ATR72 mission profile
  ambient_temperature: 288.15       # K
  assigned_to_node: 2              # LH2 tank provides mission fuel

  # Mission-specific parameters
  parameters:
    fuel_required_kg: 500.0         # Total fuel requirement
    peak_flow_rate_kg_s: 0.5        # Peak demand flow rate
    mission_duration_s: 3600.0      # Mission duration
    discharge_pressure_bar: 5.0     # Required discharge pressure

# Global fluid properties and physics configuration
physics:
  # Fluid property calculation method
  fluid_properties:
    use_coolprop: true
    coolprop_fluid: "H2"

    # Backup properties (used only if CoolProp fails)
    backup_properties:
      specific_gas_constant: 4124.0
      heat_capacity_ratio: 1.4
      kinematic_viscosity: 1e-7
      speed_of_sound: 1000.0

  # Global numerical parameters
  numerical:
    pressure_tolerance_pa: 1000.0
    flow_rate_tolerance_kg_s: 1e-5
    property_update_frequency: 1
    temperature_tolerance_k: 0.1

# Solver configuration
solver:
  method: "LSODA"
  rtol: 1e-6
  atol: 1e-8
  time_step: 1.0                    # s
  max_step: 20.0                    # s
  custom_config: true

# Output and visualization configuration
output:
  identifier: "coupled_ch2_lh2_v2"
  save_plots: true
  save_data: true
  plot_formats: ["png", "pdf"]
  data_format: "csv"
  results_directory: "output/results"
  plots_directory: "output/plots"

  # Global plotting style
  plots:
    style:
      use_greyscale: true
      enable_multi_tank_overlay: false
      font:
        master_size: 16
        legend_size: 10
        font_name: "Cambria"

    # Enabled plot types
    enabled_plots:
      - "tank_states"
      - "fuel_flow_profile"
      - "density_temperature"
      - "mass_flows"
      - "pressure_requirements"

    # Global plot configurations
    tank_states:
      figsize: [12, 10]
      filename: "tank_states"

    fuel_flow_profile:
      figsize: [14, 10]
      filename: "fuel_flow_profile"

    density_temperature:
      figsize: [12, 8]
      filename: "density_temperature"
      arrow_position: 0.05
      arrow_size: 1.0

    mass_flows:
      filename: "mass_flows"
      include_venting_flow: true
      include_coupling_flows: false  # Don't show coupling on flow plot

    pressure_requirements:
      enabled: true
      filename: "pressure_requirements"
      show_scatter_points: true