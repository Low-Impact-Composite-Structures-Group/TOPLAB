[pytest]
markers =
    unit: unit-level tests
    integration: integration tests
    slow: slow tests (excluded by default in some runners)
    nist: NIST materials framework tests
    config: configuration parsing/validation tests
    orchestrator: orchestrator/system wiring tests
    regression: end-to-end regression tests
    fallback: fallback/compatibility path tests
    coupling: inter-tank coupling tests
    plotting: plotting-related tests
    physics: physics validation tests
    validation: configuration/validation tests
    performance: performance-oriented tests
