analysis:
  name: Single Tank CH2 Benchmark
  description: Gaseous hydrogen single tank validation case using orchestrated framework
  version: '1.0'
network:
  nodes:
  - node_id: 1
    type: tank
    description: Tank 1
    fluid: CH2
    geometry:
      phi: 1.0
      mission_based_sizing: true
    initial_conditions:
      pressure: 70000000.0
      density: 40
      temperature: 45.0
    operating_limits:
      minimum_pressure: 1000000.0
      venting_pressure: 80000000.0
    materials:
      liner:
        nist_path: aluminum_6061T6_nist
        thickness: 0.001
      composite:
        nist_path: carbon_epoxy_nist
        winding_angle: 54.7
        thickness: calculated
      insulation:
        thickness: 0.05
        heat_transfer_coefficient: 50
      safety_margin: 1.25
    stopping_criteria:
      minimum_density: 2.0
      use_density_stopping_events: false
    plotting: {}
  edges: []
mission:
  type: discharge
  profile: csv
  parameters:
    csv_file: ../../missions/atr72_fuel_flows.csv
    cruise_altitude: 7010.0
    standard_temperature: 273.15
    mach_number: 0.0
    phase: gas
  ambient_temperature: 288.15
  assigned_to_node: 1
solver:
  method: LSODA
  rtol: 1e-6
  atol: 1e-9
  time_step: 1.0
  max_step: 10.0
  custom_config: false
output:
  silent: false
  identifier: single_tank_ch2
  save_plots: true
  plot_formats:
  - png
  - pgf
  save_data: true
  data_format: csv
  results_directory: output/results
  plots_directory: output/plots
  plots:
    figure_prefix: single_tank_ch2
    style:
      use_greyscale: true
      font:
        master_size: 16
        legend_size: 16
        font_name: Cambria
    tank_states:
      enabled: true
      figsize:
      - 12
      - 10
      filename: evolution
      xlim: null
      ylim_pressure: null
      ylim_temperature: null
      ylim_density: null
      legend_locations:
        pressure: best
        temperature: best
        density: best
    fuel_flow_profile:
      enabled: true
      figsize:
      - 14
      - 10
      filename: fuel_flow_profile
    density_temperature:
      enabled: true
      figsize:
      - 12
      - 8
      filename: density_temperature
      isobar_pressures:
      - 800
      - 700
      - 500
      - 300
      - 100
      - 20
      show_reference_pressures: false
      include_saturation_line: true
      include_isobars: true
      legend_location: upper right
    mass_flows:
      enabled: true
      figsize:
      - 12
      - 6
      filename: mass_flows
      include_venting_flow: true
      xlim: null
      ylim: null
      legend_location: best
    heat_exchanger_requirements:
      enabled: true
      figsize:
      - 12
      - 6
      filename: hex
      include_ihex: true
      include_ohex: true
      ohex_target_temperature: 200.0
      ohex_target_pressure: 20e5
      include_total: true
      xlim: null
      ylim: null
      legend_location: best
