initial_conditions:
  pressure: 8.0e+05
  temperature: 300.0
  fill: 0.0

operational_envelope:
  max_pressure: 350.0e+05
  target_mass: 11.0
  target_fill: 1.0

tank:
  type: cylindrical_spherical_end_caps
  dimensions:
    radius: 0.25
    body_length: 0.43570335168670493

mission:
  - name: "Hold"
    duration: 1000.0
    fuel_flow:
      mass_flow: 0.01
      pressure: 26.0e+05
      temperature: 20.0
    altitude: 0
    mach_number: 0.01
    ground_temperature: 303.15

material:
  type: composite
  args:
    failure_stress: 2560.0e+06
    density: 1580
    characteristic_temperature: 1500
    molecular_weight: 12.01
    winding_angle: 55

insulation:
  type: "foam_constant"
  args:
    thickness: 0.08
    density: Null
    thermal_conductivity: 0.0046

multistep_method:
  type: adam_bashforth
  timestep: 0.1

stopping_criteria:
  - target_fill_reached
  - target_mass_reached

heat_flux_factor: 1.0

dynamic_model_formulation: "ahluwalia"

thermal_model_formulation:
  internal: "single_zone_model"
  external: "forced_convection_model"