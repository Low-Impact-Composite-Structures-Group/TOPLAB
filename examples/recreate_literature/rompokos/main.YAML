initial_conditions:
  pressure: 1.4e+05
  temperature: Null
  fill: 0.95

operational_envelope:
  min_fill: 0.0
  min_mass: 500

tank:
  type: cylindrical_spherical_end_caps
  dimensions:
    radius: 1.17
    body_length: 16.6

mission: 
  file_name: "rompokos"
  fuel_flow_phase: "liquid"
