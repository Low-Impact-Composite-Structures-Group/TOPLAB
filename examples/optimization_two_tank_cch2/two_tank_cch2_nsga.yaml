optimization:
  name: two_tank_cch2_atr72_nsga2
  description: Pareto front of eta_g, eta_v and venting performance for two CcH2 tanks (equal flow split) on the ATR72 mission
  base_config: two_tank_cch2_config.yaml

# Aspect ratio (phi = 3) and insulation thickness stay at their base-config values.
design_variables:
  radius_1: {min: 0.30, max: 0.75, baseline: 0.55}
  radius_2: {min: 0.30, max: 0.75, baseline: 0.55}

dormancy:
  hold_period_h: 12.0
  maximum_vented_percentage: 12.0

nsga2:
  objectives: [eta_g, eta_v, eta_vent]
  population_size: 12
  generations: 6
  seed: 1
  eliminate_duplicates: true
  n_workers: 6
  evaluation_progress: true

output:
  results_dir: output/results
